
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotkey</title>
<style>
:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --soft: #f0eee8;
  --line: #e8e6df;
  --text: #252525;
  --muted: #77766f;
  --radius: 16px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Verdana, sans-serif;
  min-height: 100vh;
}
button, input { font: inherit; }
button { cursor: pointer; }
.topbar {
  height: 76px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  gap: 26px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 5;
}
.brand {
  font-size: 23px;
  font-weight: bold;
  letter-spacing: -1.3px;
  cursor: pointer;
}
.search {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 0 15px;
  height: 42px;
  max-width: 540px;
  flex: 1;
  margin: 0 auto;
}
.search input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 13px;
}
.search button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 19px;
}
.ai-toggle {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  display: grid;
  place-items: center;
  font-size: 17px;
  transition: background .2s;
}
.ai-toggle:hover { background: var(--soft); }
.layout {
  max-width: 1120px;
  margin: 0 auto;
  padding: 52px 28px 60px;
}
.section-label {
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-size: 10px;
  margin-bottom: 17px;
}
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 24px;
  align-items: start;
}
.calculator-card, .side-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.calculator-card { padding: 25px; }
.card-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.card-heading h1 {
  font-size: 16px;
  font-weight: 500;
  margin: 0;
}
.card-heading span {
  font-size: 11px;
  color: var(--muted);
}
.display {
  width: 100%;
  min-height: 106px;
  border-radius: 12px;
  background: var(--bg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  margin-bottom: 17px;
  overflow: hidden;
}
.previous {
  font-size: 12px;
  color: var(--muted);
  min-height: 18px;
  overflow-wrap: anywhere;
}
.current {
  font-size: clamp(27px, 5vw, 38px);
  letter-spacing: -1px;
  margin-top: 8px;
  max-width: 100%;
  overflow-wrap: anywhere;
}
.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}
.key {
  min-height: 54px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  color: var(--text);
  font-size: 15px;
  transition: background .15s, transform .15s;
}
.key:hover { background: var(--bg); }
.key:active { transform: scale(.97); }
.key.utility { background: var(--soft); }
.key.operator { font-size: 18px; background: #f3f1eb; }
.key.equals {
  background: #292929;
  color: white;
  border-color: #292929;
}
.side-column { display: grid; gap: 16px; }
.side-card { padding: 21px; }
.side-card h2 {
  font-size: 13px;
  font-weight: 500;
  margin: 0 0 18px;
}
.tool-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 0;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
  color: var(--text);
  font-size: 12px;
}
.tool-row:last-child { border-bottom: 0; padding-bottom: 2px; }
.tool-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--bg);
  font-size: 15px;
}
.tool-row:hover .tool-icon { background: var(--soft); }
.tool-row small {
  display: block;
  color: var(--muted);
  margin-top: 5px;
  font-size: 10px;
}
.keyboard-note {
  margin-top: 17px;
  font-size: 10px;
  color: var(--muted);
  text-align: center;
}
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(25,25,25,.16);
  z-index: 8;
  opacity: 0;
  visibility: hidden;
  transition: .25s;
}
.overlay.open { opacity: 1; visibility: visible; }
.ai-panel {
  position: fixed;
  z-index: 9;
  right: 0;
  top: 0;
  height: 100dvh;
  width: min(400px, 100%);
  background: white;
  border-left: 1px solid var(--line);
  transform: translateX(102%);
  transition: transform .28s ease;
  display: flex;
  flex-direction: column;
}
.ai-panel.open { transform: translateX(0); }
.ai-header {
  height: 75px;
  padding: 0 22px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ai-header h2 { font-size: 15px; font-weight: 500; }
.close-ai {
  border: 1px solid var(--line);
  background: white;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 19px;
}
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.message {
  max-width: 90%;
  border-radius: 12px;
  padding: 13px 15px;
  font-size: 12px;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.message.bot { background: var(--bg); align-self: flex-start; }
.message.user { background: #292929; color: white; align-self: flex-end; }
.ai-form {
  display: flex;
  gap: 8px;
  padding: 16px;
  border-top: 1px solid var(--line);
}
.ai-form input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
  font-size: 12px;
}
.ai-form input:focus { border-color: #aaa79e; }
.ai-form button {
  border: 0;
  border-radius: 10px;
  background: #292929;
  color: white;
  padding: 0 16px;
}
@media (max-width: 700px) {
  .topbar { padding: 0 16px; gap: 12px; height: 66px; }
  .brand { font-size: 20px; }
  .search { padding: 0 10px; }
  .layout { padding: 30px 15px; }
  .workspace { grid-template-columns: 1fr; }
  .calculator-card { padding: 17px; }
  .side-column { grid-template-columns: 1fr; }
  .key { min-height: 51px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" onclick="resetHome()">hotkey.</div>
  <form class="search" id="searchForm">
    <span aria-hidden="true">⌕</span>
    <input id="searchInput" placeholder="Search the web..." aria-label="Search the web">
    <button type="submit" aria-label="Submit search">↗</button>
  </form>
  <button class="ai-toggle" id="openAI" aria-label="Open AI assistant" title="AI assistant">✳</button>
</header>

<main class="layout" id="home">
  <div class="section-label">Workspace</div>
  <div class="workspace">
    <section class="calculator-card">
      <div class="card-heading">
        <h1>Calculator</h1>
        <span>Standard</span>
      </div>
      <div class="display" aria-live="polite">
        <div class="previous" id="previous"></div>
        <div class="current" id="current">0</div>
      </div>
      <div class="keys" id="keys">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="sign">+/−</button>
        <button class="key utility" data-action="percent">%</button>
        <button class="key operator" data-value="/">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="-">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+">+</button>

        <button class="key utility" data-action="backspace">⌫</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="equals">=</button>
      </div>
      <div class="keyboard-note">You can also use your keyboard</div>
    </section>

    <aside class="side-column">
      <section class="side-card">
        <h2>Quick tools</h2>
        <button class="tool-row" onclick="openAI()">
          <span class="tool-icon">✳</span>
          <span>AI assistant<small>Ask a question</small></span>
        </button>
        <button class="tool-row" onclick="focusSearch()">
          <span class="tool-icon">⌕</span>
          <span>Web search<small>Find something online</small></span>
        </button>
        <button class="tool-row" onclick="resetHome()">
          <span class="tool-icon">⌂</span>
          <span>Home<small>Reset calculator</small></span>
        </button>
      </section>
      <section class="side-card">
        <h2>Keyboard shortcuts</h2>
        <button class="tool-row" onclick="focusSearch()">
          <span class="tool-icon">⌘</span>
          <span>Search<small>Click to start searching</small></span>
        </button>
        <button class="tool-row" onclick="openAI()">
          <span class="tool-icon">↗</span>
          <span>Open assistant<small>Get help with a task</small></span>
        </button>
      </section>
    </aside>
  </div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="ai-panel" id="aiPanel" aria-label="AI assistant">
  <header class="ai-header">
    <h2>AI assistant</h2>
    <button class="close-ai" id="closeAI" aria-label="Close assistant">×</button>
  </header>
  <div class="messages" id="messages">
    <div class="message bot">Hi! What can I help you with?</div>
  </div>
  <form class="ai-form" id="aiForm">
    <input id="aiInput" placeholder="Write a message..." autocomplete="off" aria-label="Message">
    <button type="submit">Send</button>
  </form>
</aside>

<script>
const current = document.getElementById('current');
const previous = document.getElementById('previous');
let expression = '0';
let stored = null;
let operator = null;
let fresh = false;

function render() {
  current.textContent = expression;
}
function resetCalc() {
  expression = '0';
  stored = null;
  operator = null;
  fresh = false;
  previous.textContent = '';
  render();
}
function calculate() {
  if (stored === null || !operator) return;
  const a = stored;
  const b = Number(expression);
  let result;
  if (operator === '+') result = a + b;
  if (operator === '-') result = a - b;
  if (operator === '*') result = a * b;
  if (operator === '/') result = b === 0 ? NaN : a / b;
  previous.textContent = `${a} ${operator} ${b} =`;
  expression = Number.isFinite(result)
    ? String(Number(result.toPrecision(12)))
    : 'Error';
  stored = null;
  operator = null;
  fresh = true;
  render();
}
function press(value, action) {
  if (action === 'clear') return resetCalc();
  if (action === 'backspace') {
    expression = expression.length > 1 ? expression.slice(0, -1) : '0';
    render();
    return;
  }
  if (action === 'sign') {
    if (expression !== '0' && expression !== 'Error')
      expression = String(-Number(expression));
    render();
    return;
  }
  if (action === 'percent') {
    expression = String(Number(expression) / 100);
    render();
    return;
  }
  if (action === 'equals') return calculate();

  if (['+', '-', '*', '/'].includes(value)) {
    if (operator && !fresh) calculate();
    stored = Number(expression);
    operator = value;
    previous.textContent = `${expression} ${value}`;
    fresh = true;
    return;
  }
  if (value === '.') {
    if (fresh || expression === 'Error') expression = '0';
    if (!expression.includes('.')) expression += '.';
    fresh = false;
    render();
    return;
  }
  if (expression === 'Error' || fresh || expression === '0') {
    expression = value;
    fresh = false;
  } else if (expression.length < 16) {
    expression += value;
  }
  render();
}
document.getElementById('keys').addEventListener('click', e => {
  const button = e.target.closest('button');
  if (button) press(button.dataset.value, button.dataset.action);
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (/^[0-9.]$/.test(e.key)) press(e.key);
  else if (['+', '-', '*', '/'].includes(e.key)) press(e.key);
  else if (e.key === 'Enter' || e.key === '=') press('', 'equals');
  else if (e.key === 'Backspace') press('', 'backspace');
  else if (e.key === 'Escape') {
    resetCalc();
    closeAI();
  }
});
function resetHome() {
  resetCalc();
  document.getElementById('home').scrollIntoView({behavior:'smooth'});
}
function focusSearch() {
  document.getElementById('searchInput').focus();
}
document.getElementById('searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const query = document.getElementById('searchInput').value.trim();
  if (query) window.open(
    'https://www.google.com/search?q=' + encodeURIComponent(query),
    '_blank',
    'noopener,noreferrer'
  );
});

const panel = document.getElementById('aiPanel');
const overlay = document.getElementById('overlay');
function openAI() {
  panel.classList.add('open');
  overlay.classList.add('open');
  document.getElementById('aiInput').focus();
}
function closeAI() {
  panel.classList.remove('open');
  overlay.classList.remove('open');
}
document.getElementById('openAI').addEventListener('click', openAI);
document.getElementById('closeAI').addEventListener('click', closeAI);
overlay.addEventListener('click', closeAI);

const messages = document.getElementById('messages');
document.getElementById('aiForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  input.value = '';
  const answer = getDemoReply(text);
  setTimeout(() => addMessage(answer, 'bot'), 250);
});
function addMessage(text, type) {
  const message = document.createElement('div');
  message.className = 'message ' + type;
  message.textContent = text;
  messages.appendChild(message);
  messages.scrollTop = messages.scrollHeight;
}
function getDemoReply(text) {
  const q = text.toLowerCase();
  if (q.includes('hello') || q.includes('hi ')) {
    return 'Hello! I’m ready to help. Ask me a question or tell me what you’re working on.';
  }
  if (q.includes('time') || q.includes('date')) {
    return 'You can check the current date and time on your device. This demo assistant does not have live clock access.';
  }
  if (q.includes('calculate') || /[0-9]\s*[+\-*/]\s*[0-9]/.test(q)) {
    return 'Use the calculator on the main page for calculations. I’m a demo assistant and cannot evaluate arbitrary math yet.';
  }
  return 'Thanks for your message! This assistant panel is currently a front-end demo, so it is not connected to a live AI service yet. You can connect an AI API to enable real answers.';
}
</script>
</body>
</html>
