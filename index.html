<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Base Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Circular', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #5a5a5a; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #888; }

    /* --- LOGIN SCREEN --- */
    #loginScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #1f1f1f, #000);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .login-box {
      background: #121212; padding: 50px 40px; border-radius: 12px;
      text-align: center; width: 400px; border: 1px solid #282828;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .login-box i { font-size: 50px; color: #1db954; margin-bottom: 20px; }
    .login-box h1 { font-size: 28px; margin-bottom: 30px; }
    .login-box input {
      width: 100%; padding: 14px; margin-bottom: 15px;
      background: #121212; border: 1px solid #404040; border-radius: 4px;
      color: #fff; font-size: 14px; outline: none;
    }
    .login-box input:focus { border-color: #fff; }
    .login-box button {
      width: 100%; padding: 14px; background: #1db954; color: #000;
      border: none; border-radius: 30px; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 10px; transition: 0.2s;
    }
    .login-box button:hover { background: #1ed760; transform: scale(1.02); }

    /* --- MAIN APP LAYOUT --- */
    #appScreen { display: none; flex-direction: column; height: 100vh; }
    
    .main-layout { display: flex; flex: 1; overflow: hidden; padding: 8px; gap: 8px; }

    /* Sidebar */
    .sidebar {
      width: 280px; background: #121212; border-radius: 8px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header { padding: 20px; display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 16px; color: #b3b3b3; }
    .sidebar-header i { font-size: 24px; }
    .sidebar-content { flex: 1; overflow-y: auto; padding: 0 10px; }
    
    .playlist-item {
      display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 6px;
      cursor: pointer; transition: background 0.2s;
    }
    .playlist-item:hover { background: #282828; }
    .playlist-item.active { background: #333; }
    .pl-cover { width: 48px; height: 48px; border-radius: 4px; background: #333; object-fit: cover; }
    .pl-info { flex: 1; min-width: 0; }
    .pl-title { font-size: 14px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-artist { font-size: 12px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Main Content Area */
    .main-content {
      flex: 1; background: linear-gradient(180deg, #1f1f1f 0%, #121212 100%);
      border-radius: 8px; display: flex; flex-direction: column; overflow: hidden;
    }
    
    .top-bar {
      padding: 16px 24px; display: flex; align-items: center; gap: 15px;
      background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); z-index: 10;
    }
    .search-container {
      flex: 1; max-width: 400px; position: relative;
    }
    .search-container i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #000; }
    .search-container input {
      width: 100%; padding: 12px 12px 12px 45px; border-radius: 30px;
      border: none; font-size: 14px; outline: none; font-weight: 500;
    }

    .content-scroll { flex: 1; overflow-y: auto; padding: 24px; }
    .section-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .card {
      background: #181818; padding: 16px; border-radius: 8px; cursor: pointer;
      transition: background 0.3s; position: relative;
    }
    .card:hover { background: #282828; }
    .card-img { width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: cover; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .card-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-artist { font-size: 14px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .play-btn-hover {
      position: absolute; right: 24px; bottom: 80px; width: 48px; height: 48px;
      background: #1db954; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #000; font-size: 20px; opacity: 0; transform: translateY(10px); transition: all 0.3s;
      box-shadow: 0 8px 8px rgba(0,0,0,0.3);
    }
    .card:hover .play-btn-hover { opacity: 1; transform: translateY(0); }

    /* --- BOTTOM PLAYER BAR --- */
    .player-bar {
      height: 90px; background: #181818; border-top: 1px solid #282828;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
      flex-shrink: 0;
    }

    /* Left: Now Playing info */
    .player-left { width: 30%; display: flex; align-items: center; gap: 15px; min-width: 180px; }
    .player-art { width: 56px; height: 56px; border-radius: 6px; background: #333; object-fit: cover; }
    .player-info { display: flex; flex-direction: column; min-width: 0; }
    .player-title { font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-artist { font-size: 12px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .like-btn { background: none; border: none; color: #b3b3b3; font-size: 18px; cursor: pointer; margin-left: 10px; }
    .like-btn.liked { color: #1db954; }

    /* Center: Controls */
    .player-center { flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 600px; }
    .controls { display: flex; align-items: center; gap: 25px; margin-bottom: 8px; }
    .controls button { background: none; border: none; color: #b3b3b3; font-size: 16px; cursor: pointer; transition: color 0.2s; }
    .controls button:hover { color: #fff; }
    .main-play { font-size: 36px !important; color: #fff !important; }
    .main-play:hover { transform: scale(1.05); }
    
    .progress-wrapper { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 12px; color: #b3b3b3; }
    .progress-track { flex: 1; height: 4px; background: #5a5a5a; border-radius: 2px; cursor: pointer; position: relative; }
    .progress-fill { height: 100%; background: #fff; border-radius: 2px; width: 0%; }
    .progress-track:hover .progress-fill { background: #1db954; }

    /* Right: Volume */
    .player-right { width: 30%; display: flex; align-items: center; justify-content: flex-end; gap: 15px; }
    .volume-track { width: 100px; height: 4px; background: #5a5a5a; border-radius: 2px; cursor: pointer; }
    .volume-fill { height: 100%; background: #fff; border-radius: 2px; width: 100%; }
    .volume-track:hover .volume-fill { background: #1db954; }

    /* Loading Spinner */
    .spinner { display: none; text-align: center; padding: 40px; color: #b3b3b3; font-size: 24px; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-box">
      <i class="fab fa-spotify"></i>
      <h1>Log in to Spotify</h1>
      <input type="text" id="loginUser" placeholder="Username or email">
      <input type="password" id="loginPass" placeholder="Password">
      <button onclick="handleLogin()">Log In</button>
      <p style="margin-top: 20px; font-size: 12px; color: #b3b3b3;">No account? Just click Log In!</p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen">
    
    <div class="main-layout">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="sidebar-header">
          <i class="fab fa-spotify" style="color:#fff;"></i> Your Library
        </div>
        <div class="sidebar-content" id="sidebarPlaylist">
          <!-- Playlists will be added here -->
          <p style="padding: 15px; font-size: 14px; color: #b3b3b3; text-align: center;">Search for songs to add them to your library.</p>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="main-content">
        <div class="top-bar">
          <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="What do you want to listen to?" onkeydown="handleSearch(event)">
          </div>
        </div>

        <div class="content-scroll">
          <h2 class="section-title" id="sectionTitle">Trending Now</h2>
          <div class="grid" id="musicGrid">
            <!-- Music Cards will load here -->
          </div>
          <div class="spinner" id="loadingSpinner"><i class="fas fa-spinner fa-spin"></i></div>
        </div>
      </div>
    </div>

    <!-- BOTTOM PLAYER BAR -->
    <div class="player-bar">
      <!-- Left -->
      <div class="player-left">
        <img id="playerArt" class="player-art" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="cover">
        <div class="player-info">
          <div class="player-title" id="playerTitle">No song playing</div>
          <div class="player-artist" id="playerArtist">Select a song</div>
        </div>
        <button class="like-btn" id="likeBtn" onclick="toggleLike()"><i class="far fa-heart"></i></button>
      </div>

      <!-- Center -->
      <div class="player-center">
        <div class="controls">
          <button><i class="fas fa-random"></i></button>
          <button onclick="prevSong()"><i class="fas fa-step-backward"></i></button>
          <button class="main-play" id="mainPlayBtn" onclick="togglePlay()"><i class="fas fa-play-circle"></i></button>
          <button onclick="nextSong()"><i class="fas fa-step-forward"></i></button>
          <button><i class="fas fa-redo"></i></button>
        </div>
        <div class="progress-wrapper">
          <span id="currTime">0:00</span>
          <div class="progress-track" id="progressTrack" onclick="seek(event)">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span id="totalTime">0:00</span>
        </div>
      </div>

      <!-- Right -->
      <div class="player-right">
        <i class="fas fa-volume-up" style="color:#b3b3b3; font-size:14px;"></i>
        <div class="volume-track" onclick="setVolume(event)">
          <div class="volume-fill" id="volumeFill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden Audio Player -->
  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    // --- STATE & VARIABLES ---
    let playlist = [];
    let currentIndex = -1;
    let isPlaying = false;
    let isLiked = false;
    let currentSearchQuery = "Top Hits"; // Default search

    const audio = document.getElementById('audioPlayer');

    // --- LOGIN LOGIC ---
    function handleLogin() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'flex';
      // Load default songs on login
      searchMusic('Drake');
    }

    // --- SEARCH & API LOGIC (Deezer API) ---
    async function handleSearch(event) {
      if (event.key === 'Enter') {
        const query = document.getElementById('searchInput').value.trim();
        if (query) searchMusic(query);
      }
    }

    async function searchMusic(query) {
      document.getElementById('sectionTitle').textContent = `Search results for "${query}"`;
      document.getElementById('musicGrid').innerHTML = '';
      document.getElementById('loadingSpinner').style.display = 'block';

      try {
        // Deezer API endpoint
        // Note: Deezer requires JSONP or a proxy due to CORS. We will use a public CORS proxy to make it work directly in the browser.
        const proxyUrl = 'https://corsproxy.io/?';
        const apiUrl = `https://api.deezer.com/search?q=${encodeURIComponent(query)}&limit=30`;
        
        const response = await fetch(proxyUrl + encodeURIComponent(apiUrl));
        const data = await response.json();

        if (data.data && data.data.length > 0) {
          playlist = data.data; // Store the list of tracks
          renderCards();
        } else {
          document.getElementById('musicGrid').innerHTML = '<p style="color:#b3b3b3;">No results found.</p>';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('musicGrid').innerHTML = '<p style="color:#ff4444;">Error connecting to music server. Try again.</p>';
      } finally {
        document.getElementById('loadingSpinner').style.display = 'none';
      }
    }

    // --- RENDER UI ---
    function renderCards() {
      const grid = document.getElementById('musicGrid');
      grid.innerHTML = '';

      playlist.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => playSong(index);

        card.innerHTML = `
          <img class="card-img" src="${track.album.cover_medium}" alt="cover">
          <div class="play-btn-hover"><i class="fas fa-play"></i></div>
          <div class="card-title">${track.title}</div>
          <div class="card-artist">${track.artist.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    // --- PLAYBACK LOGIC ---
    function playSong(index) {
      currentIndex = index;
      const track = playlist[index];

      // Update player bar UI
      document.getElementById('playerTitle').textContent = track.title;
      document.getElementById('playerArtist').textContent = track.artist.name;
      document.getElementById('playerArt').src = track.album.cover_medium;
      
      // Reset like button
      isLiked = false;
      updateLikeUI();

      // Load audio
      // Deezer provides a 30-second preview MP3 for free
      audio.src = track.preview;
      audio.play();
      
      isPlaying = true;
      updatePlayUI();
      
      // Add to sidebar library
      addToSidebar(track);
    }

    function togglePlay() {
      if (currentIndex === -1) return; // No song loaded
      
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play();
        isPlaying = true;
      }
      updatePlayUI();
    }

    function updatePlayUI() {
      const btn = document.getElementById('mainPlayBtn');
      if (isPlaying) {
        btn.innerHTML = '<i class="fas fa-pause-circle"></i>';
      } else {
        btn.innerHTML = '<i class="fas fa-play-circle"></i>';
      }
    }

    function nextSong() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      playSong(currentIndex);
    }

    function prevSong() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      playSong(currentIndex);
    }

    // --- AUDIO EVENTS ---
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progressFill').style.width = `${percent}%`;
        document.getElementById('currTime').textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('totalTime').textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      nextSong();
    });

    // --- SEEKING & VOLUME ---
    function seek(e) {
      const track = document.getElementById('progressTrack');
      const rect = track.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const percent = clickX / rect.width;
      if (audio.duration) audio.currentTime = percent * audio.duration;
    }

    function setVolume(e) {
      const track = document.querySelector('.volume-track');
      const rect = track.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const percent = Math.max(0, Math.min(1, clickX / rect.width));
      audio.volume = percent;
      document.getElementById('volumeFill').style.width = `${percent * 100}%`;
    }

    // --- UTILS ---
    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function toggleLike() {
      isLiked = !isLiked;
      updateLikeUI();
    }

    function updateLikeUI() {
      const btn = document.getElementById('likeBtn');
      if (isLiked) {
        btn.classList.add('liked');
        btn.innerHTML = '<i class="fas fa-heart"></i>';
      } else {
        btn.classList.remove('liked');
        btn.innerHTML = '<i class="far fa-heart"></i>';
      }
    }

    // --- SIDEBAR LOGIC ---
    const sidebarSongs = new Set(); // Prevent duplicates
    function addToSidebar(track) {
      if (sidebarSongs.has(track.id)) return;
      sidebarSongs.add(track.id);

      const sidebar = document.getElementById('sidebarPlaylist');
      
      // Remove the "Search for songs..." text if it exists
      if (sidebarSongs.size === 1) sidebar.innerHTML = '';

      const item = document.createElement('div');
      item.className = 'playlist-item';
      item.innerHTML = `
        <img class="pl-cover" src="${track.album.cover_small}">
        <div class="pl-info">
          <div class="pl-title">${track.title}</div>
          <div class="pl-artist">${track.artist.name}</div>
        </div>
      `;
      // Find track in global playlist to get index, or just play preview directly
      item.onclick = () => {
        audio.src = track.preview;
        document.getElementById('playerTitle').textContent = track.title;
        document.getElementById('playerArtist').textContent = track.artist.name;
        document.getElementById('playerArt').src = track.album.cover_medium;
        audio.play();
        isPlaying = true;
        updatePlayUI();
      };
      sidebar.appendChild(item);
    }

    // Handle enter key for search
    document.getElementById('searchInput').addEventListener('keydown', handleSearch);
  </script>
</body>
</html>
